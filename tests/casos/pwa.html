<!-- Prueba "pwa": se inyecta en index.html (ver tests/ejecutar.py). -->
<script>
window.alert = () => {};
window.confirm = () => true;
document.addEventListener('DOMContentLoaded', () => setTimeout(async () => {
  const out = [];
  const pre = document.createElement('pre'); pre.id = 'PROGRESS_PRE'; document.body.appendChild(pre);
  out.push = (...a) => { Array.prototype.push.apply(out, a); pre.textContent = out.join(String.fromCharCode(10)); };
  const ok = (name, cond) => out.push((cond ? 'PASS ' : 'FAIL ') + name);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    out.push('INFO online=' + navigator.onLine + ' controller=' + !!navigator.serviceWorker.controller);
    const toolboxBg = getComputedStyle(document.querySelector('.toolbox')).backgroundColor;
    ok('css loaded (' + toolboxBg + ')', toolboxBg === 'rgb(15, 23, 42)');
    ok('js ran (theme options ' + document.querySelectorAll('#themeSelector option').length + ')', document.querySelectorAll('#themeSelector option').length >= 4);
    out.push('INFO readyState=' + document.readyState);
    // La app registra el service worker en "load", que aquí se retrasa: se registra a mano
    await navigator.serviceWorker.register('sw.js');
    const reg = await Promise.race([navigator.serviceWorker.ready, wait(8000).then(() => null)]);
    ok('service worker active', !!(reg && reg.active));
    for (let k = 0; k < 20 && !(await caches.keys()).length; k++) await wait(250);
    const keys = await caches.keys();
    // Versión y archivos de la app, leídos de la propia página
    const version = (document.querySelector('script[src*="?v="]').getAttribute('src').split('?v=')[1] || '').trim();
    ok('cache created ' + keys.join(','), keys.includes('reportes-' + version));
    if (keys.length) {
      const cache = await caches.open('reportes-' + version);
      const urls = (await cache.keys()).map(r => r.url.replace(location.origin, ''));
      out.push('INFO cached: ' + urls.join(' '));
      const appFiles = [...document.querySelectorAll('script[src^="JS/"], link[rel="stylesheet"][href^="CSS/"]')].map(el => '/' + (el.getAttribute('src') || el.getAttribute('href')));
      ok('app files found (' + appFiles.length + ')', appFiles.length >= 3);
      ['/', '/index.html', ...appFiles, '/manifest.json', '/ASSETS/icon-192.png', '/privacidad.html']
        .forEach(u => ok('cached ' + u, urls.includes(u)));
    }
    const man = await (await fetch('manifest.json')).json();
    ok('manifest ok', man.start_url === './' && man.display === 'standalone' && man.icons.length === 3);
  } catch (e) { out.push('ERROR ' + e.message + ' ' + e.stack); }
  out.push('INFO done'); const fin = document.createElement('pre'); fin.id = 'TEST_RESULTS'; fin.textContent = out.join(String.fromCharCode(10)); document.body.appendChild(fin);
}, 0));
</script>
