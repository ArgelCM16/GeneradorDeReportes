<!-- Prueba "imagenes": se inyecta en index.html (ver tests/ejecutar.py). -->
<script>
window.alert = () => {};
window.confirm = () => true;
window.addEventListener('load', () => setTimeout(async () => {
  const out = [];
  const ok = (name, cond) => out.push((cond ? 'PASS ' : 'FAIL ') + name);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    closeOnboarding();
    saveProfile({ onboardingDone: true });
    const c = document.createElement('canvas'); c.width = 2400; c.height = 1600;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 2400, 1600); g.addColorStop(0, '#0ea5e9'); g.addColorStop(1, '#f97316');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 2400, 1600);
    for (let i = 0; i < 3000; i++) { ctx.fillStyle = `hsl(${i % 360},60%,50%)`; ctx.beginPath(); ctx.arc(Math.random() * 2400, Math.random() * 1600, 4 + Math.random() * 20, 0, 7); ctx.fill(); }
    const url = c.toDataURL('image/png');
    out.push('png KB ' + Math.round(url.length / 1024));
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    out.push('blob ' + blob.size);
    reportData = [{ id: 50, type: 'image', content: '', caption: 'Foto' }]; render();
    const fr = new FileReader();
    const t0 = performance.now();
    fr.onload = () => out.push('plain reader ok ' + Math.round(performance.now() - t0));
    fr.onerror = () => out.push('reader error ' + fr.error);
    fr.readAsDataURL(blob);
    handleImage(50, { files: [new File([blob], 'foto.png', { type: 'image/png' })] });
    for (let k = 0; k < 40 && !reportData[0].content; k++) await wait(250);
    out.push('content ' + reportData[0].content.slice(0, 25) + ' ' + Math.round(reportData[0].content.length / 1024) + 'KB');
    ok('handleImage reduced', reportData[0].content.startsWith('data:image/jpeg') && reportData[0].content.length < url.length);
    ok('image in preview', !!document.querySelector('#preview-container img[src^="data:image/jpeg"]'));
    ok('stored in localStorage after autosave', await (async () => { await wait(800); return (localStorage.getItem('reportData') || '').includes('data:image/jpeg'); })());
  } catch (e) { out.push('ERROR ' + e.message + ' ' + e.stack); }
  const pre = document.createElement('pre'); pre.id = 'TEST_RESULTS'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}, 1500));
</script>
